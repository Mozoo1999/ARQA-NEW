name: Build Internal Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-internal-apk:
    name: Build standalone release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub-hosted Linux runners expose KVM, but the runner account needs
      # this udev rule before Android Emulator Runner can use acceleration.
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check mobile TypeScript
        run: pnpm --dir apps/mobile exec tsc --noEmit

      - name: Generate Android project
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --no-install --clean

      - name: Configure reproducible Android performance measurements
        run: node apps/mobile/scripts/configure-android-performance-measurement.cjs apps/mobile/android

      - name: Build standalone internal release APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/narqa-ebos-arm64-v8a-internal.apk"

      - name: Verify standalone APK artifact
        run: |
          APK=narqa-ebos-arm64-v8a-internal.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          AAPT="$(command -v aapt || find "${ANDROID_HOME:?}/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.narqa.ebos'"
          "$AAPT" dump badging "$APK" | grep -q "native-code: 'arm64-v8a'"
          ! "$AAPT" dump badging "$APK" | grep -q "uses-permission: name='android.permission.WRITE_CONTACTS'"
          ! "$AAPT" dump badging "$APK" | grep -q "uses-permission: name='android.permission.READ_EXTERNAL_STORAGE'"
          ! "$AAPT" dump badging "$APK" | grep -q "uses-permission: name='android.permission.WRITE_EXTERNAL_STORAGE'"
          ! "$AAPT" dump badging "$APK" | grep -q "uses-permission: name='android.permission.SYSTEM_ALERT_WINDOW'"
          ! "$AAPT" dump badging "$APK" | grep -q "uses-permission: name='android.permission.USE_BIOMETRIC'"
          ! "$AAPT" dump badging "$APK" | grep -q "uses-permission: name='android.permission.USE_FINGERPRINT'"

      - name: Check Android artifact size budget
        run: |
          set -euo pipefail
          AAPT="$(command -v aapt || find "${ANDROID_HOME:?}/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(command -v apksigner || find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          export AAPT APKSIGNER
          node apps/mobile/scripts/check-android-release-artifact.cjs \
            narqa-ebos-arm64-v8a-internal.apk \
            apps/mobile/performance/android-size-budget.json \
            android-size-report.json

      # The distribution artifact remains arm64-only for managed internal Android devices.
      # Build the identical source for x86_64 solely because GitHub-hosted emulators use it.
      - name: Build x86_64 APK for emulator smoke test
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-x86_64-smoke.apk
          AAPT="$(command -v aapt || find "${ANDROID_HOME:?}/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging app/build/outputs/apk/release/app-release-x86_64-smoke.apk | grep -q "native-code: 'x86_64'"

      - name: Create Android smoke evidence directory
        run: |
          mkdir -p android-smoke-evidence android-performance-evidence
          cp android-size-report.json android-performance-evidence/android-size-report.json

      - name: Install and launch Android emulator smoke build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            # android-emulator-runner invokes this block with /bin/sh.
            set -eu
            adb logcat -c
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release-x86_64-smoke.apk
            adb shell am force-stop com.narqa.ebos
            adb shell monkey -p com.narqa.ebos -c android.intent.category.LAUNCHER 1
            sleep 12
            adb shell pidof com.narqa.ebos | grep -Eq '^[0-9 ]+$'
            adb shell dumpsys activity activities | grep -Eq 'mResumedActivity:.*com.narqa.ebos|topResumedActivity.*com.narqa.ebos'
            ! adb logcat -d -v brief | grep -q 'FATAL EXCEPTION.*com.narqa.ebos'
            adb shell dumpsys meminfo com.narqa.ebos > android-performance-evidence/meminfo-before-macrobenchmark.txt
            adb shell dumpsys gfxinfo com.narqa.ebos > android-performance-evidence/gfxinfo-before-macrobenchmark.txt
            ./apps/mobile/android/gradlew -p apps/mobile/android :macrobenchmark:connectedCheck \
              -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR \
              -PreactNativeArchitectures=x86_64 \
              --no-daemon --max-workers=2
            find apps/mobile/android/macrobenchmark/build/outputs \
              -type f \( -name '*.json' -o -name '*.perfetto-trace' \) \
              -exec cp --parents {} android-performance-evidence/ \;
            adb shell dumpsys meminfo com.narqa.ebos > android-performance-evidence/meminfo-after-macrobenchmark.txt
            adb shell dumpsys gfxinfo com.narqa.ebos > android-performance-evidence/gfxinfo-after-macrobenchmark.txt
            adb logcat -d -v time > android-smoke-evidence/logcat.txt
            adb logcat -d -v time > android-performance-evidence/logcat.txt
            ! grep -q 'FATAL EXCEPTION.*com.narqa.ebos' android-performance-evidence/logcat.txt
            adb exec-out screencap -p > android-smoke-evidence/launch.png

      - name: Upload Android emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narqa-ebos-android-emulator-smoke-evidence
          path: android-smoke-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Android performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narqa-ebos-android-performance-evidence
          path: android-performance-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Upload standalone internal APK
        uses: actions/upload-artifact@v4
        with:
          name: narqa-ebos-internal-release-apk
          path: narqa-ebos-arm64-v8a-internal.apk
          if-no-files-found: error
          retention-days: 14
