name: Build Internal Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-internal-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check mobile TypeScript
        run: pnpm --dir apps/mobile exec tsc --noEmit

      - name: Generate Android project
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --no-install --clean

      - name: Build internal debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK artifact
        run: test -f apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload internal APK
        uses: actions/upload-artifact@v4
        with:
          name: narqa-ebos-internal-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
